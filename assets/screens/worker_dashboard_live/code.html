<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Worker Dashboard - TradeFind</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#d3daea",
                        "surface-variant": "#dce2f3",
                        "outline": "#8c7164",
                        "error": "#ba1a1a",
                        "surface-bright": "#f9f9ff",
                        "on-secondary-container": "#5c6274",
                        "on-primary-fixed-variant": "#783200",
                        "primary-fixed-dim": "#ffb690",
                        "inverse-primary": "#ffb690",
                        "primary": "#9d4300",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f0f3ff",
                        "surface-container": "#e7eefe",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#e2e8f8",
                        "secondary": "#575e70",
                        "secondary-fixed": "#dce2f7",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#93ccff",
                        "secondary-container": "#d9dff5",
                        "background": "#f9f9ff",
                        "on-secondary-fixed": "#141b2b",
                        "primary-fixed": "#ffdbca",
                        "on-surface-variant": "#584237",
                        "inverse-on-surface": "#ebf1ff",
                        "secondary-fixed-dim": "#c0c6db",
                        "inverse-surface": "#2a313d",
                        "on-primary-fixed": "#341100",
                        "primary-container": "#f97316",
                        "on-error-container": "#93000a",
                        "on-surface": "#151c27",
                        "on-primary-container": "#582200",
                        "on-tertiary-container": "#003554",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#001d32",
                        "surface": "#f9f9ff",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#dce2f3",
                        "tertiary-fixed": "#cde5ff",
                        "on-secondary-fixed-variant": "#404758",
                        "on-tertiary-fixed-variant": "#004b74",
                        "on-background": "#151c27",
                        "surface-tint": "#9d4300",
                        "outline-variant": "#e0c0b1",
                        "tertiary": "#006398",
                        "tertiary-container": "#00a2f4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "12px",
                        "component-padding": "16px",
                        "section-gap": "32px",
                        "grid-column-3": "1fr 1fr 1fr",
                        "container-margin": "20px"
                    },
                    "fontFamily": {
                        "h2": ["Inter"],
                        "h1": ["Inter"],
                        "label-caps": ["Inter"],
                        "h4": ["Inter"],
                        "h3": ["Inter"],
                        "display": ["Inter"],
                        "body": ["Inter"]
                    },
                    "fontSize": {
                        "h2": ["22px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "h1": ["28px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "h4": ["16px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "h3": ["18px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "display": ["42px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body": ["15px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .pulse-animation::before {
            content: '';
            position: absolute;
            left: -50%;
            top: -50%;
            right: -50%;
            bottom: -50%;
            border-radius: 50%;
            border: 2px solid white;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-body text-on-surface antialiased pb-[100px] pt-[80px]">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-4 bg-white/95 dark:bg-gray-900/95 rounded-xl mt-3 mx-4 h-[56px] shadow-[0_8px_24px_rgba(0,0,0,0.1)]">
<div class="flex items-center text-gray-900 dark:text-gray-50 active:scale-95 duration-150 cursor-pointer">
<span class="material-symbols-outlined mr-2">menu</span>
</div>
<div class="flex flex-col items-center">
<span class="font-h4 text-h4 text-green-600">You're live</span>
</div>
<div class="flex items-center active:scale-95 duration-150 cursor-pointer">
<div class="w-8 h-8 rounded-full bg-surface-container overflow-hidden">
<img alt="User Avatar" class="w-full h-full object-cover" data-alt="Close up portrait of a male professional tradesperson in a bright modern environment" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAg2E7jkbH0LRIErL8bh1-HVCrr5AezXIOpRB1SKTu-yPrEa76PKSuZ_XDbRLVPa8XXIBc0aA8aNYIUQBy5tSFqgpprN2XQiBoc_amKqUbEmuNBjb2Jvp3IYsCp_cOdA-qyYv-D2lPnS2ydkUWIGFzptPSORmcNbbBRAtNHKm8FMq6Y4ahNAeNUCgCIo7qrelUFSkHFL_eMTEKRFhxYiqAc-3V6JTcKqs3PmFTCtU8rhgVU8dRT2UVAQop70Zc19_wUsQRNmRI8Ezc"/>
</div>
</div>
</header>
<main class="px-container-margin max-w-lg mx-auto space-y-section-gap">
<!-- Availability Card -->
<section class="bg-green-600 rounded-xl p-6 shadow-[0_4px_20px_rgba(0,0,0,0.05)] relative overflow-hidden">
<div class="flex justify-between items-center mb-6 relative z-10">
<div class="flex items-center gap-4">
<div class="relative w-10 h-10 flex items-center justify-center bg-white/20 rounded-full pulse-animation">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">sensors</span>
</div>
<span class="font-h3 text-h3 text-white">You're live</span>
</div>
<div class="w-12 h-6 bg-white rounded-full p-1 cursor-pointer flex justify-end items-center transition-colors">
<div class="w-4 h-4 bg-green-600 rounded-full shadow-sm"></div>
</div>
</div>
<button class="w-full py-3 border border-white text-white rounded-full font-h4 text-h4 text-center active:bg-white/10 transition-colors relative z-10">
                Go Offline
            </button>
</section>
<!-- Live Stats Row -->
<section class="bg-surface-container-lowest rounded-xl p-4 shadow-[0_4px_20px_rgba(0,0,0,0.05)] flex items-center gap-3">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">visibility</span>
<p class="font-body text-body text-on-surface-variant">
<span class="font-semibold text-on-surface">3 customers</span> viewed your profile in the last hour
             </p>
</section>
<!-- Broadcast Map Card -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] overflow-hidden">
<div class="h-48 relative bg-surface-variant w-full" data-location="Birmingham" style="">
<img alt="Map View" class="w-full h-full object-cover opacity-80 mix-blend-multiply" data-alt="Clean minimal street map view of Birmingham city center from above" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCz3dQ_yA9iMcqpVtr26hpSJASt6fFx8321Hw4NoQdUAIh_0eqev0uk_K344JauGdYe4GutgSZigPWP50X-MqlAFrdw6t1ok6j_883g1rtNNcJ7Cr-3L28aVXkE0d43ZKXVNbV705MYYgbA7woAUmqEFa1xwuJN1-mzQ_OK9fFcGvCQQEGep-Sc3HV6P-ij7pILI4NKAiD1zGt_kLxrbngaHTyA1dNzQ5MVV9uym6qtFidbK4r4F1wmyD2nLGpbLW0Fjlsa-WdbtU0"/>
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-32 h-32 rounded-full border-2 border-primary-container bg-primary-container/20 flex items-center justify-center relative">
<div class="w-4 h-4 bg-primary-container rounded-full shadow-lg relative z-10"></div>
<div class="absolute inset-0 border border-primary-container/50 rounded-full animate-ping" style="animation-duration: 3s;"></div>
</div>
</div>
</div>
<div class="p-4 flex items-center gap-3 border-t border-surface-container">
<span class="material-symbols-outlined text-on-surface-variant">my_location</span>
<span class="font-h4 text-h4 text-on-surface">3.5 mile radius from Birmingham, B11</span>
</div>
</section>
<!-- Bento Grid -->
<section class="grid grid-cols-2 gap-4">
<!-- New Leads -->
<div class="bg-surface-container-lowest rounded-xl p-5 shadow-[0_4px_20px_rgba(0,0,0,0.05)] flex flex-col items-center justify-center text-center">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-2">NEW LEADS</span>
<span class="font-display text-display text-primary-container">12</span>
</div>
<!-- Rating -->
<div class="bg-surface-container-lowest rounded-xl p-5 shadow-[0_4px_20px_rgba(0,0,0,0.05)] flex flex-col items-center justify-center text-center">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-2">RATING</span>
<div class="flex items-center gap-1 text-on-surface">
<span class="font-display text-display">4.9</span>
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
<!-- Upcoming Jobs -->
<div class="col-span-2 bg-inverse-surface text-inverse-on-surface rounded-xl p-5 shadow-[0_4px_20px_rgba(0,0,0,0.05)] flex justify-between items-center">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-surface-variant mb-1">UPCOMING JOBS</span>
<span class="font-h3 text-h3 text-white">2 scheduled today</span>
</div>
<div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">
<span class="material-symbols-outlined text-white">chevron_right</span>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-6 pb-safe bg-white/80 dark:bg-gray-900/80 backdrop-blur-md docked full-width h-[83px] border-t border-gray-100 dark:border-gray-800 shadow-[0_-1px_3px_rgba(0,0,0,0.05)] md:hidden">
<!-- Active Tab: Home -->
<a class="flex flex-col items-center justify-center bg-orange-50 dark:bg-orange-900/20 text-orange-600 dark:text-orange-400 rounded-full px-4 py-1 transition-all duration-200 ease-in-out" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-sans text-[11px] font-medium uppercase tracking-wider">Home</span>
</a>
<!-- Inactive Tab: Map -->
<a class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 hover:text-orange-500 dark:hover:text-orange-300 transition-all duration-200 ease-in-out" href="#">
<span class="material-symbols-outlined mb-1">distance</span>
<span class="font-sans text-[11px] font-medium uppercase tracking-wider">Map</span>
</a>
<!-- Inactive Tab: Jobs -->
<a class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 hover:text-orange-500 dark:hover:text-orange-300 transition-all duration-200 ease-in-out" href="#">
<span class="material-symbols-outlined mb-1">work</span>
<span class="font-sans text-[11px] font-medium uppercase tracking-wider">Jobs</span>
</a>
<!-- Inactive Tab: Profile -->
<a class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 hover:text-orange-500 dark:hover:text-orange-300 transition-all duration-200 ease-in-out" href="#">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-sans text-[11px] font-medium uppercase tracking-wider">Profile</span>
</a>
</nav>
</body></html>
