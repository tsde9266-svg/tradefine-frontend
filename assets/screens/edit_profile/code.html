<body class="bg-background text-on-background antialiased min-h-screen">

</button>

<button class="font-h4 text-h4 text-primary active:opacity-70 duration-150">Save</button>

<button aria-label="Change profile picture" class="absolute bottom-0 right-0 w-8 h-8 bg-primary rounded-full flex items-center justify-center shadow-[0_4px_12px_rgba(157,67,0,0.3)] active:scale-95 duration-150 border-2 border-surface-container-lowest">
<span class="material-symbols-outlined text-on-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</button>
</div>
<p class="font-body text-body text-secondary mt-3">Tap to change photo</p>
</section>

<div class="space-y-6">
<!-- Personal Info Card -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] overflow-hidden">
<div class="px-component-padding py-3 border-b border-surface-variant/30">
<h2 class="font-label-caps text-label-caps text-secondary uppercase tracking-wider">Personal Info</h2>
</div>
<div class="flex flex-col">
<button class="flex items-center justify-between px-component-padding py-4 border-b border-surface-variant/30 active:bg-surface-container-low transition-colors text-left w-full group">
<div class="flex-1">
<p class="font-body text-body text-secondary mb-1">Full Name</p>
<p class="font-h4 text-h4 text-on-surface">James Wilson</p>
</div>
<span class="material-symbols-outlined text-outline-variant group-active:text-secondary">chevron_right</span>
</button>
<button class="flex items-center justify-between px-component-padding py-4 active:bg-surface-container-low transition-colors text-left w-full group">
<div class="flex-1">
<p class="font-body text-body text-secondary mb-1">Profession</p>
<p class="font-h4 text-h4 text-on-surface">Master Electrician</p>
</div>
<span class="material-symbols-outlined text-outline-variant group-active:text-secondary">chevron_right</span>
</button>
</div>
</section>

<p class="font-h4 text-h4 text-on-surface">james.w@example.com</p>

</button>

<p class="font-h4 text-h4 text-on-surface">+1 (555) 123-4567</p>
</div>
<span class="material-symbols-outlined text-outline-variant group-active:text-secondary">chevron_right</span>
</button>
<button class="flex items-center justify-between px-component-padding py-4 active:bg-surface-container-low transition-colors text-left w-full group">
<div class="flex-1">

<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface-variant appearance-none cursor-pointer transition-transform duration-200 ease-in-out z-10 peer" id="emergency-toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-200 peer-checked:bg-primary" for="emergency-toggle"></label>
<style>
                                .toggle-checkbox:checked { right: 0; border-color: #9d4300; }

                            </style>
</div>
</div>
</div>
</section>
</div>
